name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install uv CLI
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies via uv
        run: |
          uv sync --no-dev

      - name: Run tests (via uv)
        run: uv run -m pytest tests

      - name: Check formatting (via uv)
        run: uv run black --check .